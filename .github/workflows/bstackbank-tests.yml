name: BStackBank Mobile Tests

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Test scenario to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - login
          - transfer
          - transactions
          - smoke
          - regression
      platform:
        description: 'Target platform'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
      enable_biometric:
        description: 'Enable Biometric authentication (requires BrowserStack biometric capability)'
        required: false
        default: false
        type: boolean
      enable_network_logs:
        description: 'Enable Network Logs'
        required: false
        default: true
        type: boolean
      enable_device_logs:
        description: 'Enable Device Logs'
        required: false
        default: false
        type: boolean
      enable_accessibility:
        description: 'Enable BrowserStack App Accessibility scans'
        required: false
        default: false
        type: boolean
      wcag_version:
        description: 'WCAG version for accessibility scans (used when accessibility is enabled)'
        required: false
        default: 'wcag21aa'
        type: choice
        options:
          - wcag21aa
          - wcag21aaa
          - wcag22aa
          - wcag22aaa
      enable_image_injection:
        description: 'Enable camera image injection (QR scan, KYC liveness selfie)'
        required: false
        default: true
        type: boolean
      enable_percy:
        description: 'Enable App Percy visual testing (one snapshot per unique app screen)'
        required: false
        default: false
        type: boolean

jobs:
  run-tests:
    name: Run ${{ inputs.scenario }} tests on ${{ inputs.platform }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify injection media and KYC document are present
        run: |
          test -f "config/Resource/KYC Verification Document.pdf" || { echo "::error::KYC document missing from repo"; exit 1; }
          test -f config/Resource/image.png || { echo "::error::selfie image missing from repo"; exit 1; }
          if [ "${{ inputs.enable_image_injection }}" != "true" ]; then
            echo "::warning::Image injection disabled - QR/liveness scenarios will not pass"
          fi
          if [ "${{ inputs.enable_biometric }}" != "true" ]; then
            echo "::warning::Biometric disabled - the sign-up/KYC scenario sends a biometric PASS and needs enable_biometric=true"
          fi
          if [ -z "${{ secrets.SIGNUP_PASSWORD }}" ]; then
            echo "::warning::SIGNUP_PASSWORD secret is not set - sign-up scenario will fail"
          fi

      - name: Set tag expression and build tags
        id: tag
        run: |
          SCENARIO="${{ inputs.scenario }}"
          PLATFORM="${{ inputs.platform }}"
          BIOMETRIC="${{ inputs.enable_biometric }}"

          # Cucumber tag expression
          if [ "$SCENARIO" = "all" ]; then
            echo "tag_expr=" >> $GITHUB_OUTPUT
          else
            echo "tag_expr=@${SCENARIO}" >> $GITHUB_OUTPUT
          fi

          # Build tags for BrowserStack Test Reporting & Analytics
          BIOMETRIC_TAG="biometric-off"
          if [ "$BIOMETRIC" = "true" ]; then
            BIOMETRIC_TAG="biometric-on"
          fi
          A11Y_TAG="a11y-off"
          if [ "${{ inputs.enable_accessibility }}" = "true" ]; then A11Y_TAG="a11y-on"; fi
          PERCY_TAG="percy-off"
          if [ "${{ inputs.enable_percy }}" = "true" ]; then PERCY_TAG="percy-on"; fi
          BUILD_TAGS='["'"$SCENARIO"'","'"$PLATFORM"'","'"$BIOMETRIC_TAG"'","'"$A11Y_TAG"'","'"$PERCY_TAG"'","build-${{ github.run_number }}","branch-${{ github.ref_name }}"]'
          echo "build_tags=$BUILD_TAGS" >> $GITHUB_OUTPUT

      - name: Run BStackBank tests on BrowserStack
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BS_APP_ID: ${{ secrets.BS_APP_ID }}
          PLATFORM: ${{ inputs.platform }}
          ENABLE_BIOMETRIC: ${{ inputs.enable_biometric }}
          ENABLE_IMAGE_INJECTION: ${{ inputs.enable_image_injection }}
          # Media uploaded to BrowserStack (media://...); expires after 30 days. Falls back to config/test-data.js
          SELFIE_MEDIA_URL: ${{ vars.SELFIE_MEDIA_URL }}
          QR_MEDIA_URL: ${{ vars.QR_MEDIA_URL }}
          SIGNUP_PASSWORD: ${{ secrets.SIGNUP_PASSWORD }}
          ENABLE_NETWORK_LOGS: ${{ inputs.enable_network_logs }}
          ENABLE_DEVICE_LOGS: ${{ inputs.enable_device_logs }}
          ENABLE_ACCESSIBILITY: ${{ inputs.enable_accessibility }}
          WCAG_VERSION: ${{ inputs.wcag_version }}
          ENABLE_PERCY: ${{ inputs.enable_percy }}
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          BUILD_TAGS: ${{ steps.tag.outputs.build_tags }}
          BUILD_NUMBER: ${{ github.run_number }}
          BROWSERSTACK_BUILD_NAME: "BStackBank ${{ inputs.scenario }} - ${{ github.run_number }}"
        run: |
          TAG_EXPR="${{ steps.tag.outputs.tag_expr }}"
          # App Percy: wrap the run in `percy app:exec` so snapshots are uploaded
          RUNNER=""
          if [ "$ENABLE_PERCY" = "true" ]; then
            RUNNER="npx percy app:exec --"
          fi
          if [ -z "$TAG_EXPR" ]; then
            $RUNNER npx wdio run wdio.conf.js
          else
            $RUNNER npx wdio run wdio.conf.js --cucumberOpts.tagExpression="$TAG_EXPR"
          fi

      - name: BrowserStack Build Report
        if: always()
        uses: browserstack/github-actions/browserstack-report-action@master
        with:
          username: ${{ secrets.BROWSERSTACK_USERNAME }}
          access-key: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          build-name: "BStackBank ${{ inputs.scenario }} - ${{ github.run_number }}"
          report-timeout: 120

      - name: Upload Cucumber JSON reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-json-reports-${{ inputs.scenario }}-${{ inputs.platform }}
          path: reports/cucumber-json/
          retention-days: 30

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-${{ inputs.scenario }}-${{ inputs.platform }}
          path: reports/screenshots/
          retention-days: 7
